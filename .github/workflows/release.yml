      - name: Verify Linux portability
        run: |
          readelf -d build/bin/phase_limiter | grep NEEDED
          FORBIDDEN=$(readelf -d build/bin/phase_limiter | grep NEEDED | grep -v -E "libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|libstdc\+\+\.so|libgcc_s\.so|ld-linux" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Unapproved dynamic libraries found: $FORBIDDEN"
            exit 1
          fi
      - name: Assemble release package
        run: |
          mkdir -p package/phaselimiter/bin
          cp build/bin/phase_limiter package/phaselimiter/bin/
          cp -r resource package/phaselimiter/
          cp -r licenses package/phaselimiter/
          python3 -c "
          import os, sys
          req = ['boost.txt','onetbb.txt','pocketfft.txt','libpng.txt','zlib.txt','eigen.txt','gflags.txt','picojson.txt','hnswlib.txt','libsimdpp.txt','optim.txt','cimg.txt','armadillo.txt','phaselimiter.txt']
          for f in req:
              p = os.path.join('package/phaselimiter/licenses', f)
              if not os.path.isfile(p) or os.path.getsize(p) == 0:
                  print(f'ERROR: Missing or empty license file: {p}')
                  sys.exit(1)
          print('All 14 license files verified non-empty.')
          "
          cp LICENSE package/phaselimiter/
          cp PORTING.md package/phaselimiter/
          tar -C package -cJf phaselimiter-0.2.0-native3-linux-arm64.tar.xz phaselimiter
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-linux-arm64
          path: phaselimiter-0.2.0-native3-linux-arm64.tar.xz

  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build static dependencies
        run: |
          chmod +x scripts/build_static_deps.sh
          ./scripts/build_static_deps.sh $HOME/deps
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPHASELIMITER_STATIC_DEPS=ON \
            -DPHASELIMITER_WAV_ONLY=ON \
            -DPHASELIMITER_DEPS_PREFIX=$HOME/deps \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DDISABLE_TARGET_BENCH=ON \
            -DDISABLE_TARGET_TEST=ON
      - name: Build phase_limiter
        run: |
          cmake --build build --target phase_limiter -j$(sysctl -n hw.ncpu)
      - name: Strip and Sign binary
        run: |
          strip build/bin/phase_limiter
          codesign --force --sign - build/bin/phase_limiter
      - name: Verify macOS portability
        run: |
          echo "=== Dynamic Dependencies (otool -L) ==="
          otool -L build/bin/phase_limiter
          FORBIDDEN=$(otool -L build/bin/phase_limiter | grep -v "/usr/lib/" | grep -v "/System/Library/" | grep -v "build/bin/phase_limiter" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Third-party dylib detected: $FORBIDDEN"
            exit 1
          fi
          codesign -v --strict build/bin/phase_limiter
      - name: Assemble release package
        run: |
          mkdir -p package/phaselimiter/bin
          cp build/bin/phase_limiter package/phaselimiter/bin/
          cp -r resource package/phaselimiter/
          cp -r licenses package/phaselimiter/
          python3 -c "
          import os, sys
          req = ['boost.txt','onetbb.txt','pocketfft.txt','libpng.txt','zlib.txt','eigen.txt','gflags.txt','picojson.txt','hnswlib.txt','libsimdpp.txt','optim.txt','cimg.txt','armadillo.txt','phaselimiter.txt']
          for f in req:
              p = os.path.join('package/phaselimiter/licenses', f)
              if not os.path.isfile(p) or os.path.getsize(p) == 0:
                  print(f'ERROR: Missing or empty license file: {p}')
                  sys.exit(1)
          print('All 14 license files verified non-empty.')
          "
          cp LICENSE package/phaselimiter/
          cp PORTING.md package/phaselimiter/
          tar -C package -cJf phaselimiter-0.2.0-native3-macos-arm64.tar.xz phaselimiter
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-macos-arm64
          path: phaselimiter-0.2.0-native3-macos-arm64.tar.xz

