          cp -r resource package/phaselimiter/
          cp -r licenses package/phaselimiter/
          python3 -c "
          import os, sys
          req = ['boost.txt','onetbb.txt','pocketfft.txt','libpng.txt','zlib.txt','eigen.txt','gflags.txt','picojson.txt','hnswlib.txt','libsimdpp.txt','optim.txt','cimg.txt','armadillo.txt','phaselimiter.txt']
          for f in req:
              p = os.path.join('package/phaselimiter/licenses', f)
              if not os.path.isfile(p) or os.path.getsize(p) == 0:
                  print(f'ERROR: Missing or empty license file: {p}')
                  sys.exit(1)
          print('All 14 license files verified non-empty.')
          "
          cp LICENSE package/phaselimiter/
          cp PORTING.md package/phaselimiter/
          tar -C package -cJf phaselimiter-0.2.0-native3-macos-x86_64.tar.xz phaselimiter
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-macos-x86_64
          path: phaselimiter-0.2.0-native3-macos-x86_64.tar.xz

  proof-linux-x64:
    name: Proof Linux x64 on Clean Ubuntu 22.04 & Debian 12
    needs: build-linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test data
        uses: actions/checkout@v4
        with:
          sparse-checkout: test_data
      - name: Download Linux x64 asset
        uses: actions/download-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-linux-x64
      - name: Proof on clean Ubuntu 22.04
        run: |
          docker run --rm \
            -v "$(pwd)":/work \
            -w /work \
            ubuntu:22.04 \
            bash -c "
              tar -xf phaselimiter-0.2.0-native3-linux-x64.tar.xz
              ./phaselimiter/bin/phase_limiter -help || true
              ./phaselimiter/bin/phase_limiter \
                -input=test_data/test5.wav \
                -output=/tmp/proof_out.wav \
                -mastering_reference_file=phaselimiter/resource/mastering_reference.json \
                -sound_quality2_cache=phaselimiter/resource/sound_quality2_cache \
                -disable_input_encode=true \
                -output_format=wav \
                -sample_rate=44100 \
                -bit_depth=16 \
                -ceiling=-0.1 \
                -mastering=true \
                -tmp=/tmp
              test -s /tmp/proof_out.wav
              echo 'Clean Ubuntu 22.04 execution successful!'
            "
      - name: Proof on clean Debian 12
        run: |
          docker run --rm \
            -v "$(pwd)":/work \
            -w /work \
            debian:12 \
            bash -c "
              ./phaselimiter/bin/phase_limiter -help || true
              ./phaselimiter/bin/phase_limiter \
                -input=test_data/test5.wav \
                -output=/tmp/proof_deb_out.wav \
                -mastering_reference_file=phaselimiter/resource/mastering_reference.json \
                -sound_quality2_cache=phaselimiter/resource/sound_quality2_cache \
                -disable_input_encode=true \
                -output_format=wav \
                -sample_rate=44100 \
                -bit_depth=16 \
                -ceiling=-0.1 \
                -mastering=true \
                -tmp=/tmp
              test -s /tmp/proof_deb_out.wav
              echo 'Clean Debian 12 execution successful!'
            "

  proof-linux-arm64:
    name: Proof Linux arm64 on Clean Ubuntu 22.04
    needs: build-linux-arm64
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04
    steps:
      - name: Install proof dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates xz-utils ffmpeg
      - name: Checkout test data
        uses: actions/checkout@v4
        with:
          sparse-checkout: test_data
      - name: Download Linux arm64 asset
        uses: actions/download-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-linux-arm64
      - name: Proof on clean Ubuntu 22.04
        run: |
          tar -xf phaselimiter-0.2.0-native3-linux-arm64.tar.xz
          ./phaselimiter/bin/phase_limiter -help || true
          ./phaselimiter/bin/phase_limiter \
            -input=test_data/test5.wav \
            -output=/tmp/proof_arm64_out.wav \
            -mastering_reference_file=phaselimiter/resource/mastering_reference.json \
            -sound_quality2_cache=phaselimiter/resource/sound_quality2_cache \
            -disable_input_encode=true \
            -output_format=wav \
            -sample_rate=44100 \
            -bit_depth=16 \
            -ceiling=-0.1 \
            -mastering=true \
            -tmp=/tmp
          test -s /tmp/proof_arm64_out.wav
          echo 'Clean Ubuntu 22.04 ARM64 execution successful!'

  proof-macos-arm64:
    name: Proof macOS arm64
    needs: build-macos-arm64
    runs-on: macos-15
    steps:
      - name: Checkout test data
        uses: actions/checkout@v4
        with:
          sparse-checkout: test_data
      - name: Download macOS arm64 asset
        uses: actions/download-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-macos-arm64
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Verify signature & execute proof
        run: |
          tar -xf phaselimiter-0.2.0-native3-macos-arm64.tar.xz
          codesign -v --strict phaselimiter/bin/phase_limiter
          ./phaselimiter/bin/phase_limiter -help || true
          ./phaselimiter/bin/phase_limiter \
            -input=test_data/test5.wav \
            -output=/tmp/proof_mac_out.wav \
            -mastering_reference_file=phaselimiter/resource/mastering_reference.json \
            -sound_quality2_cache=phaselimiter/resource/sound_quality2_cache \
            -disable_input_encode=true \
            -output_format=wav \
            -sample_rate=44100 \
            -bit_depth=16 \
            -ceiling=-0.1 \
            -mastering=true \
            -tmp=/tmp
          test -s /tmp/proof_mac_out.wav

  equivalence-gate:
    name: Numerical Equivalence Gate (vs Upstream IPP)
    needs: build-linux-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download candidate asset
        uses: actions/download-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-linux-x64
      - name: Download and unpack upstream reference release
        run: |
          curl -fsSL https://github.com/ai-mastering/phaselimiter/releases/download/v0.2.0/release.tar.xz -o upstream_release.tar.xz
          mkdir -p upstream_ref
          tar -xf upstream_release.tar.xz -C upstream_ref
          tar -xf phaselimiter-0.2.0-native3-linux-x64.tar.xz
      - name: Generate synthetic 90s audio if needed
        run: |
          python3 scripts/equivalence_gate.py --generate-test-audio test_data/synth_90s.wav
      - name: Process audio with upstream reference in Ubuntu 20.04 container
        run: |
          mkdir -p ref_out cand_out tmp_ref tmp_cand
          docker run --rm \
            -v "$(pwd)":/work \
            -w /work \
            ubuntu:20.04 \
            bash -c "
              apt-get update && apt-get install -y ffmpeg libtbb2 libsndfile1
              for f in test_data/test5.wav test_data/test2.wav test_data/synth_90s.wav; do
                base=\$(basename \"\$f\")
                upstream_ref/phaselimiter/bin/phase_limiter \
                  -input=\"\$f\" \
                  -output=\"ref_out/\$base\" \
                  -mastering_reference_file=phaselimiter/resource/mastering_reference.json \
                  -sound_quality2_cache=phaselimiter/resource/sound_quality2_cache \
                  -disable_input_encode=true \
                  -output_format=wav \
                  -sample_rate=44100 \
                  -bit_depth=16 \
                  -ceiling=-0.1 \
                  -mastering=true \
                  -tmp=tmp_ref
              done
            "
      - name: Install candidate dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg python3
      - name: Process audio with candidate on Ubuntu 22.04 host
        run: |
          for f in test_data/test5.wav test_data/test2.wav test_data/synth_90s.wav; do
            base=$(basename "$f")
            ./phaselimiter/bin/phase_limiter \
              -input="$f" \
              -output="cand_out/$base" \
              -mastering_reference_file=phaselimiter/resource/mastering_reference.json \
              -sound_quality2_cache=phaselimiter/resource/sound_quality2_cache \
              -disable_input_encode=true \
              -output_format=wav \
              -sample_rate=44100 \
              -bit_depth=16 \
              -ceiling=-0.1 \
              -mastering=true \
              -tmp=tmp_cand
          done
      - name: Verify numerical equivalence
        run: |
          python3 scripts/equivalence_gate.py \
            --compare-pairs \
            ref_out/test5.wav cand_out/test5.wav \
            ref_out/test2.wav cand_out/test2.wav \
            ref_out/synth_90s.wav cand_out/synth_90s.wav

  publish-release:
    name: Publish Release Assets & SHA256SUMS
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-macos-arm64
      - build-macos-x86_64
      - proof-linux-x64
      - proof-linux-arm64
      - proof-macos-arm64
      - equivalence-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum phaselimiter-0.2.0-native3-*.tar.xz > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/phaselimiter-0.2.0-native3-*.tar.xz
            dist/SHA256SUMS
          generate_release_notes: true
