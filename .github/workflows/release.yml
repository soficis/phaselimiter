name: Release Portable PhaseLimiter

on:
  push:
    tags:
      - 'v*-native*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x64:
    name: Build Linux x64 (Ubuntu 22.04)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates xz-utils python3 \
            bzip2 pkg-config file
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build static dependencies
        run: |
          chmod +x scripts/build_static_deps.sh
          ./scripts/build_static_deps.sh /opt/deps
      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_BUILD_TYPE=Release \
            -DPHASELIMITER_STATIC_DEPS=ON \
            -DPHASELIMITER_WAV_ONLY=ON \
            -DPHASELIMITER_DEPS_PREFIX=/opt/deps \
            -DDISABLE_TARGET_BENCH=ON \
            -DDISABLE_TARGET_TEST=ON
      - name: Build phase_limiter
        run: |
          cmake --build build --target phase_limiter -j$(nproc)
      - name: Strip binary
        run: |
          strip build/bin/phase_limiter
      - name: Verify Linux portability
        run: |
          echo "=== NEEDED Shared Libraries ==="
          readelf -d build/bin/phase_limiter | grep NEEDED
          # Check for forbidden dependencies (only standard libc/libm/libpthread/libdl/librt/libstdc++/libgcc allowed)
          FORBIDDEN=$(readelf -d build/bin/phase_limiter | grep NEEDED | grep -v -E "libc\.so|libm\.so|libpthread\.so|libdl\.so|librt\.so|libstdc\+\+\.so|libgcc_s\.so|ld-linux" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Unapproved dynamic libraries found: $FORBIDDEN"
            exit 1
          fi
          echo "=== Maximum GLIBC Version ==="
          objdump -p build/bin/phase_limiter | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1
      - name: Assemble release package
        run: |
          mkdir -p package/phaselimiter/bin
          cp build/bin/phase_limiter package/phaselimiter/bin/
          cp -r resource package/phaselimiter/
          cp -r licenses package/phaselimiter/
          python3 -c "
          import os, sys
          req = ['boost.txt','onetbb.txt','pocketfft.txt','libpng.txt','zlib.txt','eigen.txt','gflags.txt','picojson.txt','hnswlib.txt','libsimdpp.txt','optim.txt','cimg.txt','armadillo.txt','phaselimiter.txt']
          for f in req:
              p = os.path.join('package/phaselimiter/licenses', f)
              if not os.path.isfile(p) or os.path.getsize(p) == 0:
                  print(f'ERROR: Missing or empty license file: {p}')
                  sys.exit(1)
          print('All 14 license files verified non-empty.')
          "
          cp LICENSE package/phaselimiter/
          cp PORTING.md package/phaselimiter/
          tar -C package -cJf phaselimiter-0.2.0-native3-linux-x64.tar.xz phaselimiter
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phaselimiter-0.2.0-native3-linux-x64
          path: phaselimiter-0.2.0-native3-linux-x64.tar.xz

